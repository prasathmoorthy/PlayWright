name: Java CI with Maven
on: 
  push: 
    branches: [ main, develop ] 
jobs: 
  build: 
    runs-on: ubuntu-latest 
    steps: 
      - uses: actions/checkout@v4 
      - name: Set up JDK 
        uses: actions/setup-java@v4 
        with: 
          java-version: '11' 
          distribution: temurin 
          cache: maven 
      - name: Build with Maven 
        run: mvn -B -V clean verify 
